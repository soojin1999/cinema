services:
  mysql:
    build:
      context: ./docker/mysql        # charset.cnf를 이미지에 COPY로 구워넣음 (bind mount 시 Windows에서 world-writable로 보여 MySQL이 무시하는 문제 회피)
    container_name: cinema-mysql
    ports:
      - "3306:3306"
    environment:
      # DB_PASSWORD는 .env 파일(gitignore 대상)에서 읽음 — application.yaml의 DB_PASSWORD와 같은 이름으로
      # 통일해서, 두 파일 비밀번호가 따로 놀던 문제(README/STATUS.md 기록)를 원천 차단
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
      # MYSQL_DATABASE 미지정 (T-09, 2026-07-21): 스키마가 4개(screening_db/seat_db/booking_db/payment_db)로
      # 나뉘면서 단일 DB를 미리 만들어주는 이 옵션이 더 이상 안 맞음 — 각 01~04-*-schema.sql이
      # 직접 CREATE DATABASE로 만든다. root 계정이라 어차피 전체 권한 있어서 없어도 무방.
      TZ: Asia/Seoul
    volumes:
      - cinema-mysql-data:/var/lib/mysql                      # 컨테이너 재시작해도 데이터 유지
      - ./src/main/resources/sql:/docker-entrypoint-initdb.d  # 컨테이너 최초 실행 시 01~05 파일명 순서대로 자동 실행
                                                                 # (01~04: 스키마별 DDL, 05: 시드 데이터, T-09)
    healthcheck:
      # mysqladmin ping이 성공하는 시점 == 공식 mysql 이미지의 docker-entrypoint가 초기화 스크립트
      # (01~05, 위 volumes)까지 전부 끝낸 뒤 "진짜" 서버를 띄운 상태 — app 서비스가 이 healthy를
      # 기다리게 해서 "스키마도 없는데 앱이 먼저 접속 시도하다 죽는" 문제를 막는다.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-password}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: cinema-app
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # application.yaml의 ${DB_HOST:localhost} 기본값을 여기서만 덮어씀 — 로컬 ./gradlew bootRun은
      # 여전히 localhost:3306(포트 매핑)으로 붙고, 컨테이너 안에서는 서비스명 mysql로 붙는다
      DB_HOST: mysql
      DB_PASSWORD: ${DB_PASSWORD:-password}
      TZ: Asia/Seoul

volumes:
  cinema-mysql-data:
