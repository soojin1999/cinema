# p6spy 설정. 콘솔에 "파라미터가 실제 값으로 치환된 완성 SQL"을 찍기 위한 용도.
# 상세: https://p6spy.readthedocs.io/

# 콘솔 표준 출력으로 로그 (별도 파일/SLF4J 연동 없이 가장 단순한 방식)
appender=com.p6spy.engine.spy.appender.StdoutLogger

# 실행시간 | 카테고리 다음 줄에 완성 SQL 출력. p6spy 내장 CustomLineFormat의 %(effectiveSql)이
# 멀티라인 SQL에서 파라미터 치환을 못 하는 버그가 있어 직접 구현한 SqlLogFormat을 쓴다 (클래스 주석 참고).
logMessageFormat=com.toy.cinema.common.logging.SqlLogFormat

# 커넥션 open/close, 결과셋 dump 같은 노이즈 제외 — SQL 실행(statement)만 남긴다
excludecategories=info,debug,result,resultset,batch,commit
