spring:
  application:
    name: cinema

  # Spring Boot가 schema.sql / data.sql을 자동 실행하지 않도록 설정
  # DDL은 직접 01~04-*-schema.sql → 05-data.sql 순서로 Docker init script가 실행 (docker-compose.yml)
  sql:
    init:
      mode: never

# T-09(2026-07-21) 도메인별 스키마 분리: spring.datasource(단일) 대신 도메인별 접속정보를 따로 둔다.
# 이 프로퍼티들은 자동 바인딩되지 않고, config 패키지의 도메인별 DataSourceConfig가
# @ConfigurationProperties(prefix = "app.datasource.xxx")로 직접 읽어서 DataSource 빈을 만든다
# (Spring Boot가 자동으로 만들어주는 단일 DataSource로는 스키마 4개를 감당할 수 없어서 수동 구성으로 전환).
# mybatis.mapper-locations/configuration도 같은 이유로 YAML이 아닌 각 SqlSessionFactory 빈에서
# 직접 지정한다.
app:
  datasource:
    screening:
      # jdbc:mysql: 앞에 p6spy: 를 끼워 넣으면 p6spy가 실제 mysql 드라이버를 감싸서
      # 파라미터가 치환된 완성 SQL을 로그로 찍어준다 (설정은 resources/spy.properties)
      jdbc-url: jdbc:p6spy:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/screening_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:password}  # docker-compose.yml의 MYSQL_ROOT_PASSWORD 기본값과 일치
      driver-class-name: com.p6spy.engine.spy.P6SpyDriver
    seat:
      jdbc-url: jdbc:p6spy:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/seat_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:password}
      driver-class-name: com.p6spy.engine.spy.P6SpyDriver
    booking:
      jdbc-url: jdbc:p6spy:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/booking_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:password}
      driver-class-name: com.p6spy.engine.spy.P6SpyDriver
    payment:
      jdbc-url: jdbc:p6spy:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/payment_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:password}
      driver-class-name: com.p6spy.engine.spy.P6SpyDriver

logging:
  level:
    com.toy.cinema: DEBUG
