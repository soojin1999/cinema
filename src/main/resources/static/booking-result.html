<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>예매 결과 — cinema</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<h1>예매 결과</h1>

<div class="result-box" id="result-box">불러오는 중...</div>

<a class="btn" href="/index.html">다른 영화 예매하기</a>

<script>
    const STATUS_MESSAGE = {
        CONFIRMED: '✅ 예매가 확정되었습니다.',
        CANCELLED: '❌ 결제 실패로 예매가 취소되었습니다.',
        PENDING: '⏳ 예매 처리 중입니다. 잠시 후 새로고침 해주세요.'
    };
    const STATUS_CLASS = {
        CONFIRMED: 'result-success',
        CANCELLED: 'result-fail',
        PENDING: 'result-pending'
    };

    async function loadResult() {
        const bookingId = new URLSearchParams(location.search).get('bookingId');
        const box = document.getElementById('result-box');

        const res = await fetch(`/bookings/${bookingId}`);
        if (!res.ok) {
            box.textContent = '예매 정보를 찾을 수 없습니다.';
            return;
        }

        const result = await res.json();
        const p = document.createElement('p');
        p.className = STATUS_CLASS[result.status] ?? '';
        p.textContent = `${STATUS_MESSAGE[result.status] ?? result.status} (예매번호: ${result.bookingId})`;
        box.innerHTML = '';
        box.appendChild(p);
    }

    loadResult();
</script>
</body>
</html>
